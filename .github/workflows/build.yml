name: Build Signed Release APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: 自動簽名並打包可安裝的 Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 自動初始化專案與圖示
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/assets@latest
          npx cap init "OscApp" "com.osc.app" --web-dir www
          npx cap add android

          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            cp icon.png assets/icon-background.png
            npx cordova-res android --skip-config --copy 2>/dev/null || npx @capacitor/assets generate --android
          fi

          npx cap sync android

      - name: 雲端自動生成金鑰並進行完整 Android 簽名 (zipalign + apksigner)
        run: |
          # 1. 生成加密金鑰
          keytool -genkey -v -keystore release.keystore -alias oscappkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "OscAppPassword123" -keypass "OscAppPassword123" -dname "CN=OscApp, OU=Dev, O=Osc, L=Taipei, ST=Taiwan, C=TW"

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -Dorg.gradle.java.home=$JAVA_HOME
          ./gradlew bundleRelease -Dorg.gradle.java.home=$JAVA_HOME

          # 2. 定位 Android SDK 工具
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # 3. 對 APK 進行 zipalign 對齊優化
          $BUILD_TOOLS_DIR/zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/OscApp-signed.apk

          # 4. 使用 apksigner 寫入 V2/V3 官方正式簽名
          $BUILD_TOOLS_DIR/apksigner sign --ks ../release.keystore --ks-pass pass:OscAppPassword123 --ks-key-alias oscappkey --key-pass pass:OscAppPassword123 app/build/outputs/apk/release/OscApp-signed.apk

      - name: 上傳可直接安裝的正式版 APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: android/app/build/outputs/apk/release/OscApp-signed.apk

      - name: 上傳 Google Play 上架專用 AAB
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
